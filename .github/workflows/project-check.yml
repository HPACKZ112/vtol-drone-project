name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calculations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scientific Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test equations, constraints, and simulation
        run: python -m unittest discover -s tests -v
      - name: Regenerate numerical reports
        run: |
          python analysis/run_analysis.py --no-plots
          python analysis/run_analysis.py --config data/sar_design.json --mass-budget data/sar_mass_budget.csv --output-dir reports/sar --no-plots
          python -m analysis.run_design_study --no-plots
      - name: Confirm numerical reports match committed inputs
        run: git diff --exit-code -- reports/example reports/sar reports/design-study
      - name: Regenerate simulation
        run: python -m simulation.run_simulation --output-dir work/ci-simulation --no-plots
      - name: Check simulation tables
        run: python tools/check_simulation_reports.py work/ci-simulation
      - name: Render charts from the sizing and simulation code
        run: |
          python analysis/run_analysis.py --output-dir work/ci-sizing-plots
          python -m analysis.run_design_study --output-dir work/ci-study-plots
          python -m simulation.run_simulation --output-dir work/ci-simulation-plots
      - name: Check repository and documentation
        run: python tools/check_project.py
