name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calculations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test equations and report generation
        run: python -m unittest discover -s tests -v
      - name: Regenerate numerical reports
        run: python analysis/run_analysis.py --no-plots
      - name: Confirm numerical reports match committed inputs
        run: git diff --exit-code -- reports/example
      - name: Check repository and documentation
        run: python tools/check_project.py
